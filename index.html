<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <meta name="theme-color" content="#6d55d1">
    <title>LexiLearn Pro - AI Flashcards & IELTS Mastery</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./assets/logo.png">
    <link rel="apple-touch-icon" href="./assets/logo.png">
    <!-- Cài đặt Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      tailwind.config = {
        future: { hoverOnlyWhenSupported: true },
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
            },
            colors: {
              brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
            },
            animation: {
              'pulse-rainbow': 'rainbow 3s linear infinite',
            },
            keyframes: {
              rainbow: {
                '0%, 100%': { filter: 'hue-rotate(0deg)' },
                '50%': { filter: 'hue-rotate(180deg)' },
              }
            }
          }
        }
      }
      document.documentElement.classList.remove('dark');
      if (document.body) document.body.classList.remove('dark');
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css">
    
    <!-- Canvas Confetti cho Gamification -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Import Map cho ES Modules -->
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js",
          "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
          "firebase/storage": "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js",
          "firebase/app-check": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app-check.js"
        }
      }
    </script>
</head>
<body ontouchstart="">
    <!-- Ứng dụng Vue -->
    <div id="app" v-cloak class="h-[100dvh] flex flex-col overflow-hidden w-full max-w-full">
        <!-- Nội dung sẽ được Vue mount vào đây -->
    </div>
    
    <!-- Code chính của App -->
    <script type="module" src="./js/app.js"></script>

    <!-- Kích hoạt PWA Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('PWA ServiceWorker đăng ký thành công với scope: ', registration.scope);
                    })
                    .catch(error => {
                        console.log('PWA ServiceWorker đăng ký thất bại: ', error);
                    });
            });
        }
    </script>
</body>
</html>
